# Schema v2 (docs/40). The skill for composing strategies from the concept
# families and testing them -- the four-tool workflow, the composition
# grammar, and the honest read of the result.
name: "Concept Strategy Builder"
version: "1.0"
kind: trading
artifact_kind: thesis
category: "strategy-composition"
knowledge: >
  The platform's concept registry is the strategy vocabulary: every detector
  across twelve families (smc, indicators, chart, candles, price action,
  volume, session, harmonics, fibonacci, supply/demand, order flow, econ) is a
  condition a composition can be built from. A composition is a JSON document:
  a name, a timeframe, a side, a condition tree (concept leaves under all/any/
  sequence), and a risk block (stop kind, sizing rule, optional management and
  guards). It is validated first, then backtested over trailing candles.

  What composes well: a structure concept for the setup (an SMC event, a chart
  pattern, a price-action break), a confirmation from a DIFFERENT family (an
  indicator agreeing, volume confirming, a session window timing it), and
  never two conditions that measure the same thing twice (an RSI zone entry
  and a stochastic zone entry are one vote wearing two names). Sessions gate;
  they do not signal. Econ events are catalysts that frame, not entries.

  The honest read of a backtest: the trade count decides what the numbers are
  worth before any of them are read. Under ten trades is anecdote, not
  evidence. A losing strategy on the window is information -- say what it says
  (the conditions do not work HERE, on this instrument, on this timeframe),
  not that the idea is dead. Risk of ruin above a few percent means the sizing
  outruns the edge. Kelly suggested is a ceiling, never a target.
rules:
  - "THE GRAMMAR (write documents in exactly this shape): {\"name\", \"version\": \"1.0.0\", \"timeframe\": \"1m\" (the SMALLEST timeframe involved -- resampling only walks UP), \"market\": \"BTCUSDT\", \"symbol2\": \"ETHUSDT\" (optional, for cross-instrument), \"side\": \"long\"|\"short\", \"conditions\": <tree>, \"risk\": <block>}."
  - "CONDITION LEAVES: {\"type\": \"concept\", \"concept\": \"<id from list_concepts>\", \"direction\": \"bullish\"|\"bearish\"|\"any\", optional \"timeframe\": \"4h\" (must be ABOVE the document's), optional \"symbol\": \"ETHUSDT\" (cross-instrument), optional \"lookback_bars\": n, optional \"min_bars_since\": n}. {\"type\": \"retrace\", \"into\": \"smc.fvg\", optional \"timeframe\", \"lookback_bars\"} (LATCHED: price came back into the concept's newest zone). {\"type\": \"price_vs\", \"side\": \"above\"|\"below\"|\"cross\", \"concept\": \"<id>\", optional \"timeframe\", \"lookback_bars\", \"tolerance\"}. {\"type\": \"indicator\", \"indicator\": \"indicators.rsi\"|\"indicators.ema.50\"|\"indicators.supertrend\"|\"indicators.macd\"|\"indicators.adx\"..., \"relation\": \"above\"|\"below\"|\"cross\" (with \"level\": n as the threshold) or \"touch_down\"|\"touch_up\"|\"cross_line\" (price against the line)}. {\"type\": \"magnitude\", \"concept\": \"<id>\", \"op\": \"above\"|\"below\", \"value\": n}. {\"type\": \"time_window\", \"start_hour\": 12, \"end_hour\": 15} (UTC)."
  - "CONDITION GROUPS: {\"type\": \"all\", \"conditions\": [...]}, {\"type\": \"any\", \"conditions\": [...]}, {\"type\": \"not\", \"condition\": ...}, {\"type\": \"sequence\", \"steps\": [{\"condition\": ..., \"lookback_bars\": n}], \"max_bars\": n, optional \"expires_after_bars\": n}."
  - "RISK BLOCK: {\"stop\": {\"type\": \"structure\"} or {\"type\": \"atr_multiple\", \"multiple\": n}, \"sizing\": {\"type\": \"fixed_fractional\", \"percent\": n} or {\"type\": \"volatility_adjusted\", \"risk_fraction\": n} or {\"type\": \"kelly\", \"cap\": n}, optional \"exit\": <condition tree> (concept-based exit), optional \"partials\": [{\"at_r\": 1.0, \"close_pct\": 50}], optional \"entry\": {\"type\": \"limit_at_proximal\"}, optional \"management\", optional \"guards\"}."
  - "WORKED EXAMPLE (the FVG scenario): {\"name\": \"mtf-fvg-bos\", \"version\": \"1.0.0\", \"timeframe\": \"15m\", \"side\": \"short\", \"conditions\": {\"type\": \"sequence\", \"max_bars\": 400, \"steps\": [{\"condition\": {\"type\": \"concept\", \"concept\": \"smc.fvg\", \"direction\": \"bearish\", \"timeframe\": \"4h\"}}, {\"condition\": {\"type\": \"retrace\", \"into\": \"smc.fvg\", \"timeframe\": \"4h\", \"lookback_bars\": 300}}, {\"condition\": {\"type\": \"indicator\", \"indicator\": \"indicators.rsi\", \"relation\": \"below\", \"level\": 45}}]}, \"risk\": {\"stop\": {\"type\": \"atr_multiple\", \"multiple\": 2.0}, \"sizing\": {\"type\": \"volatility_adjusted\", \"risk_fraction\": 0.01}, \"partials\": [{\"at_r\": 1.0, \"close_pct\": 50.0}]}}."
  - "THE WORKFLOW IS MANDATORY AND ORDERED: first `list_concepts`, then `concept_signals`, then `compose_concept_strategy`, then `backtest_composition`. Do NOT answer from `analyze_timeframe` or a generic thesis -- the user's request is to BUILD and TEST a strategy, and only these four tools do that."
  - "Call `concept_signals` before composing from evidence: a condition that has not fired recently is a theory, and the market's own offering beats the agent's imagination."
  - "Compose across families: at most one structure concept, at most one confirmation per family, and never two conditions measuring the same quantity under two names."
  - "Always validate with `compose_concept_strategy` before backtesting, and fix and re-validate until valid."
  - "Report the backtest's honest read: trade count first, then win rate and profit factor with the drawdown, and `risk_of_ruin` / `kelly_suggested` as the sizing verdict -- never a summary that hides a losing window behind a small sample."
  - "When a strategy loses, diagnose before proposing a fix: the setup, the confirmation, the timing, the sizing, or the window -- one change at a time, re-backtest, and say which single change was tested."
capability_requirements:
  required: [{capability: candles}]
  preferred: [{capability: derived_events}, {capability: sessions}, {capability: market_structure}]
conditions:
  timeframes: ["1h"]
  risk:
    max_risk_pct: 1.0
