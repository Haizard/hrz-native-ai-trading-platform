# Tool skill (docs/40, §18): doctrine for chart-drawing tools.
name: "Chart Drawing"
version: "2.5.0"
kind: tool
artifact_kind: thesis
category: "drawing"
knowledge: >
  The drawing tools put the agent's analysis on the user's own chart, as the
  user's objects. They are the one family whose output the user sees directly,
  so its doctrine is mostly restraint: every object must trace to a number a
  tool returned, and a chart littered with stale objects is worse than a bare
  one.

  Every object is sent as `points`: an ordered list of {time_ms, price}, one
  entry per anchor the kind takes. The order is the shape's own -- points[0]
  is where a ray starts, where a rect's first corner was clicked, where a
  fib's 100% level sits -- so it is never sorted before sending.

  WHICH KIND FOR WHICH IDEA (the engine's vocabulary is fixed; the gateway
  refuses anything else):
  - hline: a single price level -- support, resistance, swept liquidity, POC.
  - trendline / ray / extended: a slope between two swings -- trend lines,
    structure lines between a swing and its break.
  - rect: a price zone -- order blocks, fair value gaps, supply/demand,
    premium/discount bands. Point 1 one corner (earlier time, zone edge),
    point 2 the opposite corner (later time, other edge). For an OB:
    point 1 = OB candle open time at its extreme price, point 2 = mitigation
    time (or now) at the candle's other extreme.
  - fib: a measured retracement between two detected swings; fib_extension
    for projected targets beyond the swing.
  - position_long / position_short: a trade setup with entry, stop and target
    in one object -- the thesis's own prices.
  - measure / dateprice_range: the price/time delta of a leg, for range
    measurements and projection work.
  - channel / triangle / arc / circle / angle / vline: the parity shapes, only
    when the analysis genuinely has that geometry.
  - hray / crossline / infoline / regression / arrow / arrow_mark_up /
    arrow_mark_down: the rest of the lines group -- a level that runs one way,
    a quadrant mark, a leg's price and bar count, a fitted trend with its R, and
    a pointer at one bar. A mark is a comment on a single candle: use it where
    one word would do.
  - disjoint_channel / flat_top_bottom / pitchfork / schiff_pitchfork /
    modified_schiff_pitchfork / inside_pitchfork: bands and forks, three or four
    pivots each. Only when the analysis names the construction -- a pitchfork
    thesis is a median-line thesis, and which template the pivots make is part
    of the claim, not a styling choice.
  - The Fibonacci family, which splits on ONE question -- is the claim about
    price or about time? fib (retracement) and fib_extension are the two-anchored
    price ladders; trend_fib_extension and trend_fib_time take three anchors --
    impulse, then pullback -- and project the impulse from the pullback, the
    first in price and the second in *bars*, so a "when" claim that draws
    horizontal levels is wrong twice over. fib_time_zone is the two-anchored
    version of the same idea. fib_fan / pitchfan are rays out of the swing's
    origin (the pitchfan's keep going past the swing's box); fib_arcs and
    fib_circles are that distance as rings, arcs at both ends of the swing and
    circles around the pivot; fib_spiral winds it by phi per quarter turn;
    fib_channel is the ladder inside a trendline band; fib_wedge opens it
    symmetrically about the swing's own line.
  - The Gann family, whose claim is a *proportion* rather than a ratio of a
    swing: price and time in one unit. The second point of every Gann drawing
    states that unit -- price per bar -- and nothing else does, so a Gann shape
    whose two points share a time or a price says no unit and the fan draws
    nothing -- the engine refusing to invent a price-per-bar it was not given. gann_box is the rectangle cut into
    eighths with its 1x1 diagonal; gann_fan is nine rays (1x16 through 16x1)
    from the first point at that scale; gann_square is the box with the fan
    through its centre and arcs at the eighths; gann_square_fixed repeats one
    unit square as levels 0 through 5. Use them only when the thesis is about
    the proportion itself -- "price is rising one unit per bar, so the 1x1 is
    support" -- never as decoration on a swing that a trendline or a fib would
    state more plainly.


  The label carries the meaning the kind cannot: "Bullish OB 4H 68200-68500",
  "CHoCH 1H", "FVG 15m unfilled". Colour is per-kind and fixed by the shell --
  meaning rides the label, not a colour you cannot set.
rules:
  - "Anchor every coordinate to a number a tool returned -- a swing price, a VAH/VAL, a swept level, an OB candle's open/extreme. Never invent a price from the shape of the chart or from memory."
  - "Prefer updating an existing drawing over adding a duplicate: get_user_drawings first, then update_drawing when the level moved, create_drawing only for a genuinely new idea."
  - "One idea, one drawing set: a level plus its invalidation zone is a set; five nearby lines for one idea is clutter."
  - "fib anchors come from detected swings (detect_market_structure's swing lists), chosen by the rule the question implies (last completed leg), never eyeballed. The trend-based kinds take three, in order: impulse start, impulse end, pullback -- and the projection runs from the third."
  - "Name the axis before the kind. A level that answers WHEN goes on a time tool (trend_fib_time, fib_time_zone) and one that answers WHERE goes on a price tool; the engine draws the first as vertical lines and will not correct the choice, because a ratio of a duration printed as a price is a number about the wrong variable."
  - "Leave `level_profile` unset unless the thesis names a ladder: every fib kind already draws the grid its reference uses. Setting it to `ote`, `extension`, `classic` or `time` is a claim about which school's grid the level came from, not a styling choice."
  - "For a Gann kind, say the scale out loud in the label (\"Gann 1x1 @ 12.5/bar\") and place the second point on a price/time move you can name. The tools derive the unit from the two points alone, so an eyeballed second point is an eyeballed 1x1 -- and every other line in the fan is wrong by the same factor."
  - "rect zones span the full candle or gap that created them: an order block rectangle covers the OB candle's open-to-extreme range and extends right to now or to mitigation; a half-zone reads as a different idea."
  - "Delete what the analysis no longer supports: a level that broke is deleted or moved with a reason, and the narrative says what changed."
  - "Always state the drawing ids you created or changed in the answer, so the user can find them. The AI layer is user-toggleable -- never assume an object is visible, say where it sits."
applies_to:
  tools: [get_user_drawings, create_drawing, update_drawing, delete_drawing]
