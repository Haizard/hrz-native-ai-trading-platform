[package]
name = "paper-cli"
description = "Run a strategy as a paper bot, and check it against a replay of the same candles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
analytics-core = { workspace = true }
# This CLI reads strategies off disk, and a strategy author writes YAML.
strategy-dsl = { workspace = true, features = ["yaml"] }
strategy-runtime = { workspace = true }
backtester = { workspace = true }
trading-engine = { workspace = true }
db = { workspace = true }
market-data = { workspace = true }

anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
