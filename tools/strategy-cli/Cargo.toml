[package]
name = "strategy-cli"
description = "CLI for authoring, validating and backtesting strategy documents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
analytics-core = { workspace = true }
# This is the crate that reads strategies off disk, and a strategy author writes
# YAML. It is the one place that has to opt back in.
strategy-dsl = { workspace = true, features = ["yaml"] }
strategy-runtime = { workspace = true }
backtester = { workspace = true }
db = { workspace = true }

anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
