[package]
name = "xtask"
description = "Repository automation: migrations, market-data collection and backfill."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
analytics-core = { workspace = true }
db = { workspace = true }
market-data = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The Binance book bootstrap fetches `GET /api/v3/depth`. The collector takes the
# snapshot as a closure rather than reaching for a URL itself, so the HTTP client
# for the one venue that needs REST lives at the call site instead of inside
# `market-data`, where a second venue would have inherited it unused.
reqwest = { workspace = true }
