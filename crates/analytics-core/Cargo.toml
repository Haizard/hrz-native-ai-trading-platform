[package]
name = "analytics-core"
description = "Pure, I/O-free order-flow & indicator math. Single source of truth for chart, backtester, bots and WASM frontend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest   = { workspace = true }
# Only used by tests, to prove `MarketState` round-trips to JSON without
# emitting a `null` where a number belongs (a `NaN`/infinity would do exactly
# that, and the AI agent's tools serialize this type).
serde_json = { workspace = true }

# HARD CONSTRAINT (docs/05-ANALYTICS-ENGINE.md):
#   no async, no network, no filesystem, no database -- ever.
# This crate is the dependency leaf and MUST build for wasm32-unknown-unknown.
# CI enforces: cargo build -p analytics-core --target wasm32-unknown-unknown
