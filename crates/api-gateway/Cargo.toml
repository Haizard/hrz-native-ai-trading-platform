[package]
name = "api-gateway"
description = "Axum HTTP + WebSocket surface for the frontend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
db = { workspace = true }
analytics-core = { workspace = true }
ai-agent = { workspace = true }
# Phase 7: the gateway now runs strategies and bots itself, so it depends on the
# crates that do that work rather than shelling out to the CLIs.
backtester = { workspace = true }
trading-engine = { workspace = true }
# The supervisor opens a market feed for the symbols its bots need.
market-data = { workspace = true }
strategy-runtime = { workspace = true }
argon2 = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
uuid = { workspace = true }
strategy-dsl = { workspace = true, features = ["yaml"] }
async-trait = { workspace = true }

anyhow = { workspace = true }
chrono = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }

[dev-dependencies]
# Integration tests build the real router and drive it in-process, so they need
# a way to call a `tower` service with a request.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
