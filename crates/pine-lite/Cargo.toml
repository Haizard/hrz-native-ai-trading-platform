[package]
name = "pine-lite"
description = "Pine Script-like imperative language for indicators and strategies: lexer, parser, type checker, series interpreter and plot contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# A leaf crate, like analytics-core: nothing internal except the math crate.
# Keep it building for wasm32 for both the browser chart engine and the
# bounded server-side preview guest. docs/23 is the language spec.
[dependencies]
analytics-core = { path = "../analytics-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Nothing yet. Parity fixtures against analytics-core units live in-tree.

[[bench]]
name = "runtime_baseline"
harness = false
