[package]
name = "strategy-runtime"
description = "Executes Strategy DSL documents against live, historical or simulated data."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
analytics-core = { workspace = true }
strategy-dsl = { workspace = true }

serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# Test fixtures are written the way a human writes a strategy -- in YAML. The
# runtime itself never parses one, so this is a dev-only opt-in and the sandbox
# guest still links no YAML parser.
strategy-dsl = { workspace = true, features = ["yaml"] }
