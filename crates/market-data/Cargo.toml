[package]
name = "market-data"
description = "Exchange collectors, normalization, candle aggregation and backfill."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
analytics-core = { workspace = true }
# The capability *vocabulary* only: this crate declares each venue's data
# profile ("Bybit klines have no taker split") as `capabilities` values, and
# the venue fact lives next to the codec that enforces it, so the two cannot
# drift. The resolver itself stays in the leaf crate; nothing here resolves.
capabilities = { workspace = true }
# Browser-grade TLS for Cloudflare-fronted venues (Deriv's WS edge refuses
# rustls/LibreSSL/Node ClientHellos with a bare 520; browsers pass).
# No `db` edge, deliberately. This crate publishes normalized data to its bus and
# a binary (`xtask collect`) persists it; the collector itself never writes, so
# the dependency sat here unused. It read as "the collector persists", which is
# the opposite of the truth and is how the missing candle pump went unnoticed --
# `xtask collect` had no candle pump at all, so a collector run wrote zero
# candles. Adding `db` back means the collector has grown a write path, and that
# should be a decision rather than a leftover.
#
# Metrics only. `observability` is a leaf with no internal dependencies, so this
# edge cannot introduce a cycle and cannot pull `trading-engine` into the
# collector's process -- which matters, because the collector runs in the same
# process as nothing else and must not grow an execution engine by accident.
observability = { workspace = true }

async-trait = { workspace = true }
thiserror = { workspace = true }
# Minimal tokio, NOT the workspace's "full": the wasm consumers of this
# crate's taxonomy cannot carry mio/net, and feature unification would drag
# them in. sync (the bus), rt and time (the feeds), macros (async mains).
tokio = { version = "1", default-features = false, features = ["sync", "rt", "time", "macros"] }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# The network stack, feature-gated: wasm consumers (chart-engine) use the
# taxonomy (broker, concepts, composer) without dragging tungstenite's
# getrandom chain into the wasm32 build.
futures = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }

[features]
default = ["net"]
net = ["futures", "reqwest", "tokio-tungstenite"]

[dev-dependencies]
