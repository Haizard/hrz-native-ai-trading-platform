[package]
name = "backtester"
description = "Deterministic event-driven historical replay and performance reporting."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
analytics-core = { workspace = true }
strategy-runtime = { workspace = true }
strategy-dsl = { workspace = true }
# docs/23: a Pine-lite strategy script is one more `Strategy` source. The
# adapter in `script_strategy` drives the vetted script per bar and lowers its
# `strategy.*` calls into the same signals the DSL engine emits.
pine-lite = { workspace = true }

serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# The fixtures are YAML, because that is what a strategy author writes. The
# backtester takes an already-validated document and never parses one itself.
strategy-dsl = { workspace = true, features = ["yaml"] }
# docs/24 S4: the parity test runs the same script through the VM's own
# simulation and through `ScriptStrategy`, so the tests need the interpreter
# directly, not just through this crate's adapter.
pine-lite = { workspace = true }
