[package]
name = "backtester"
description = "Deterministic event-driven historical replay and performance reporting."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
analytics-core = { workspace = true }
strategy-runtime = { workspace = true }
strategy-dsl = { workspace = true }

serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# The fixtures are YAML, because that is what a strategy author writes. The
# backtester takes an already-validated document and never parses one itself.
strategy-dsl = { workspace = true, features = ["yaml"] }
