[workspace]
resolver = "2"
members = [
    "crates/*",
    "tools/*",
    # The chart engine is a wasm crate, not a service, so it is not under
    # `crates/`. It is still a workspace member so `cargo test` and `cargo
    # clippy --workspace` cover it.
    "frontend/chart-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

# ---------------------------------------------------------------------------
# Internal crates
# Dependency rules from docs/03-PROJECT-STRUCTURE.md:
#   analytics-core -> nothing internal (leaf, must build for wasm32)
#   market-data, db -> analytics-core
#   strategy-dsl -> analytics-core
#   strategy-runtime -> strategy-dsl, analytics-core
#   backtester, sandbox -> strategy-runtime
#   ai-agent -> strategy-dsl, analytics-core (NEVER sandbox / trading-engine)
#   trading-engine -> strategy-runtime, sandbox, db
#   api-gateway -> everything; nothing depends on api-gateway
#   observability -> nothing internal (SECOND leaf; anything may depend on it,
#                    and it must never depend on anything -- see below)
# ---------------------------------------------------------------------------
[workspace.dependencies]
analytics-core   = { path = "crates/analytics-core" }
market-data      = { path = "crates/market-data" }
# YAML is OFF by default across the workspace, and each crate opts in.
#
# This is not tidiness. The sandbox guest (crates/sandbox-guest) compiles
# strategy-dsl into WASM, and Cargo unifies features across a dependency graph:
# if any crate on the guest's path enabled `yaml`, the sandbox would link a YAML
# parser even though the guest only ever reads JSON. `default-features = false`
# can only be expressed here, in the workspace entry -- Cargo silently ignores it
# on an inherited dependency. CI asserts the result with
# `cargo tree -p sandbox-guest --target wasm32-unknown-unknown | grep serde_yaml`.
strategy-dsl     = { path = "crates/strategy-dsl", default-features = false }
strategy-runtime = { path = "crates/strategy-runtime" }
backtester       = { path = "crates/backtester" }
sandbox          = { path = "crates/sandbox" }
sandbox-guest    = { path = "crates/sandbox-guest" }
ai-agent         = { path = "crates/ai-agent" }
trading-engine   = { path = "crates/trading-engine" }
db               = { path = "crates/db" }
# Phase 8: metrics, alerts and structured logging. A leaf crate like
# analytics-core -- every service may depend on it, it depends on nothing
# internal.
observability    = { path = "crates/observability" }
# The drawing layer's vocabulary. `DrawingKind` and `Anchor` are the shape the
# browser sends, the engine positions and the API stores, so the gateway depends
# on the engine rather than mirroring those two types. A rename then breaks both
# sides at compile time -- which is the only thing that catches a wire rename,
# since nothing checks a JSON key against anything (docs/14).
#
# `api-gateway -> everything` already covers this edge; the direction that would
# be wrong is the engine depending on the gateway, and it does not.
chart-engine     = { path = "frontend/chart-engine" }

# --- async ---
tokio      = { version = "1", features = ["full"] }
async-trait = "0.1"
futures    = "0.3"

# --- serialization ---
serde      = { version = "1", features = ["derive"] }
# `float_roundtrip` is load-bearing, not a nicety.
#
# serde_json's default float parser is best-effort: for some inputs it is one ULP
# off, so `103.19999999999999` can come back as `103.2`. That is invisible until
# you compare two runs that differ only in whether a number crossed a JSON
# boundary -- which is exactly what the sandbox does on every candle. Without
# this feature the sandboxed and native backtests disagree in the last decimal
# of almost every trade, and no amount of care in the sandbox can fix it.
#
# The cost is roughly 2x on float parsing, which is not the bottleneck anywhere
# in this system.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9"

# --- errors ---
thiserror = "2"
anyhow    = "1"

# --- logging / tracing ---
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- database ---
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "migrate",
    "macros",
] }

# --- time / ids ---
chrono = { version = "0.4", features = ["serde"] }
uuid   = { version = "1", features = ["v4", "serde"] }

# --- http ---
axum       = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# --- exchange transport ---
# rustls rather than native-tls: no OpenSSL dependency to fight on Windows.
# Password hashing for /auth. Argon2 is the current recommendation for new
# passwords and is pure Rust, so it needs no system libraries in the image.
# Deliberately a library rather than anything hand-rolled: a KDF is exactly the
# kind of thing that looks right and is subtly wrong.
argon2 = "0.6"
# JWT framing (HS256) is base64 + JSON over an HMAC; the primitives come from
# these, and the same crates already sign the Bedrock SigV4 requests.
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
reqwest           = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# TLS is NOT on by default: without it `connect_async("wss://...")` fails at
# runtime with "URL error: TLS support not compiled in". rustls + webpki-roots
# keeps us off OpenSSL on Windows and matches reqwest's TLS backend.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

# --- cli ---
clap    = { version = "4", features = ["derive"] }
dotenvy = "0.15"

# --- testing ---
proptest = "1"

# ---------------------------------------------------------------------------
# Release profile: we care about analytics throughput, not binary size.
# ---------------------------------------------------------------------------
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Keep dev builds usable on large candle datasets.
[profile.dev]
opt-level = 1

# The sandbox guest is built by `sandbox`'s build.rs and then embedded, so its
# artifact size is not something anyone reads. Splitting it into more codegen
# units buys nothing for a module this small and costs real seconds on every
# rebuild. `panic = "abort"` is inherited and *is* load-bearing: a guest panic
# must trap the module rather than unwind across the FFI boundary.
[profile.release.package.sandbox-guest]
opt-level = 2
codegen-units = 16
