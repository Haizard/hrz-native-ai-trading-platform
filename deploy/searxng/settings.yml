# SearXNG settings for the trading platform's private instance.
#
# Everything inherits SearXNG's defaults except the three decisions below:
#
# 1. `search.formats` gains `json` -- the whole reason this file exists. The
#    stock default is `[html]`, and the API gateway's search_web tool calls
#    `GET /search?format=json`, which a stock instance answers 403.
# 2. `server.limiter: false` -- every search arrives from ONE client (the api
#    gateway's IP), so per-IP rate limiting would throttle the agent exactly
#    when it is working hardest. The instance is private; nothing else talks
#    to it.
# 3. `secret_key` is generated, not the shipped placeholder.
#
# Replace `general.instance_name` and `server.secret_key` as you see fit; the
# secret key here was generated with `openssl rand -hex 32` and is private to
# this deployment (it signs cookies, nothing else -- rotating it only logs
# browsers out of the HTML UI).

use_default_settings: true

general:
  debug: false
  instance_name: "Haizard Search"

server:
  secret_key: "6e08c657828ec95f17b18c4f6978bd1df7d98e515a71b2f66615eb0ab8f2ac28"
  limiter: false
  image_proxy: true

search:
  formats:
    - html
    - json

ui:
  static_use_hash: true
