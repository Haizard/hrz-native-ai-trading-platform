name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # `crates/sandbox`'s build script compiles `sandbox-guest` for
  # wasm32-unknown-unknown and embeds the result, so *every* job that builds the
  # workspace needs that target installed -- not just the `wasm` job below. The
  # build script fails with an explicit "rustup target add" hint if it is
  # missing, which is the failure this repetition prevents.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # analytics-core is the shared deterministic core -- it MUST keep building for
  # the browser target, or the "one implementation of the math" guarantee
  # (principle #1) silently breaks.
  wasm:
    name: WASM target (analytics-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p analytics-core --target wasm32-unknown-unknown

  # The sandbox guest is the one artifact in this workspace whose dependency
  # graph is a security boundary rather than a convenience (docs/08-SANDBOX-WASM.md).
  # Three things are asserted here that no other job can see:
  #
  #   1. the guest itself compiles for wasm32 and passes clippy;
  #   2. `strategy-dsl` still builds with YAML off -- the feature is a real gate,
  #      not a comment;
  #   3. the guest's *resolved* dependency graph contains no YAML parser.
  #
  # (3) is the one that matters. Feature unification is silent: some future crate
  # enabling `strategy-dsl/yaml` anywhere on the guest's path would link a YAML
  # parser into the sandbox and nothing would fail. `cargo tree` reads the graph
  # Cargo actually resolved, which is the only place that would show up.
  guest:
    name: Sandbox guest (no YAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build the guest for wasm32
        run: cargo build -p sandbox-guest --target wasm32-unknown-unknown --release
      - name: Clippy the guest for wasm32
        run: cargo clippy -p sandbox-guest --target wasm32-unknown-unknown -- -D warnings
      - name: strategy-dsl still builds without its default features
        run: cargo build -p strategy-dsl --no-default-features
      - name: The guest links no YAML parser
        run: |
          if cargo tree -p sandbox-guest --target wasm32-unknown-unknown \
               | grep -E 'serde_yaml|unsafe-libyaml'; then
            echo "::error::the sandbox guest's dependency graph contains a YAML parser."
            echo "Something on the guest's path re-enabled strategy-dsl/yaml."
            echo "YAML is default-off in the workspace [workspace.dependencies] entry;"
            echo "opt back in per crate instead of flipping the default."
            exit 1
          fi

  # The shell is vanilla JavaScript that no Rust test compiles and no bundler
  # lints, so a break in it is invisible until someone opens a browser. Three
  # things are checked here that nothing else covers:
  #
  #   1. `xtask build-frontend` still produces the artifact that actually ships;
  #   2. the four exported functions and the JSON contract still match what
  #      `app.js` calls -- a rename is not a compile error, it is a blank canvas;
  #   3. the YAML the visual builder emits still parses, and still means what
  #      the builder thought it meant.
  #
  # (2) and (3) are why this job needs Node: `wasm_abi_check.mjs` instantiates
  # the same bytes the browser fetches, and `check_builder.mjs` drives the same
  # module the shell loads. Neither is a substitute for the other -- the ABI
  # check covers the engine, the builder check covers the document.
  #
  # (3) is the subtle one. The builder emits YAML by hand in JavaScript, which
  # is exactly the kind of thing that looks right and parses wrong. So the check
  # writes its documents to disk and `strategy-cli validate` runs the *real*
  # parser over them: if the emitter drifts from the schema, it fails here
  # rather than in a user's strategy.
  frontend:
    name: Shell (chart engine + builder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the engine the way it ships
        run: cargo run -p xtask -- build-frontend
      - name: Exercise the ABI the shell depends on
        run: node tools/wasm_abi_check.mjs frontend/app/chart_engine.wasm
      - name: Check the visual builder's documents
        run: node tools/check_builder.mjs
      - name: Validate what the builder emitted with the real parser
        run: |
          for f in target/builder-check/*.yaml; do
            echo "::group::$f"
            cargo run -p strategy-cli -- validate --strategy "$f"
            echo "::endgroup::"
          done

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
